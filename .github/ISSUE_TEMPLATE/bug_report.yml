name: Bug report
description: Something in LATTICE is broken or behaves incorrectly.
title: "[bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. The app lives in `lattice/` — please run from there.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug and what you expected instead.
      placeholder: When I open a large vault, the status bar shows "Index stale" forever…
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      value: |
        1. Open vault at …
        2. Create note …
        3. See error …
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Editor
        - Indexing / search
        - Graph
        - Plugins
        - AI console
        - Vault / files
        - Other
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS + version
      placeholder: Windows 11 / macOS 14 / Ubuntu 24.04
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: LATTICE version / commit
      placeholder: v0.1.0 or git SHA
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / console output
      description: Paste relevant terminal or devtools output.
      render: shell
