[package]
name = "lattice-desktop"
version = "0.1.0"
description = "LATTICE desktop shell"
edition.workspace = true
license.workspace = true

[lib]
name = "lattice_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "lattice-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow.workspace = true
base64.workspace = true
chrono.workspace = true
lattice-ai = { path = "../../../crates/lattice-ai" }
lattice-core = { path = "../../../crates/lattice-core" }
lattice-db = { path = "../../../crates/lattice-db" }
lattice-graph = { path = "../../../crates/lattice-graph" }
lattice-indexer = { path = "../../../crates/lattice-indexer" }
lattice-plugin-runtime = { path = "../../../crates/lattice-plugin-runtime" }
lattice-search = { path = "../../../crates/lattice-search" }
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
thiserror.workspace = true
tokio.workspace = true
