[workspace]
members = [
  "apps/desktop/src-tauri",
  "crates/lattice-core",
  "crates/lattice-indexer",
  "crates/lattice-db",
  "crates/lattice-graph",
  "crates/lattice-search",
  "crates/lattice-ai",
  "crates/lattice-plugin-runtime"
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
authors = ["LATTICE contributors"]

[workspace.dependencies]
anyhow = "1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
notify = "6"
regex = "1"
rusqlite = { version = "0.32", features = ["bundled", "chrono"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
thiserror = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "fs"] }
walkdir = "2"
